<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Disciplinas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-hamburguer">
        <span class="icon-open"><i class="bi bi-list"></i></span>
        <span class="icon-close"><i class="bi bi-x-lg"></i></span>
    </label>
    <label for="menu-toggle" class="overlay-sidebar"></label>

    <div class="layout-principal">
        <nav class="sidebar">
            <a href="dashboard.html" class="logo-sidebar"><i class="bi bi-mortarboard-fill"></i><span>SGA</span></a>
            <ul class="menu-navegacao">
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
                <li><a href="alunos.html"><i class="bi bi-people-fill"></i><span>Alunos</span></a></li>
                <li><a href="professores.html"><i class="bi bi-person-workspace"></i><span>Professores</span></a></li>
                <li><a href="disciplinas.html" class="ativo"><i class="bi bi-book-fill"></i><span>Disciplinas</span></a></li>
                <li><a href="turmas.html"><i class="bi bi-diagram-3-fill"></i><span>Turmas</span></a></li>
                <li><a href="notas.html"><i class="bi bi-clipboard-check-fill"></i><span>Notas</span></a></li>
            </ul>
            <div class="rodape-sidebar">SGA v1.0</div>
        </nav>

        <div class="conteudo-principal">
            <header class="topo-header">
                <div class="breadcrumb-custom"><strong>Disciplinas</strong> / Listagem</div>
                <div class="info-usuario">
                    <span>Bem-vindo(a), <strong>Administrador</strong></span>
                    <div class="avatar">A</div>
                    <a href="#" onclick="fazerLogout(event)" class="btn-sair"><i class="bi bi-box-arrow-right"></i> Sair</a>
                </div>
            </header>

            <main class="main-content">
                <section class="form-container mb-5">
                    <h2 class="titulo-form"><i class="bi bi-journal-plus me-2"></i>Cadastrar Disciplina</h2>

                    <form onsubmit="return cadastrarDisciplina()" id="form-disciplina">
                        <div class="mb-3">
                            <label class="form-label">Código *</label>
                            <input type="text" class="form-control" id="codigo-disciplina" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nome *</label>
                            <input type="text" class="form-control" id="nome-disciplina" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Carga Horária *</label>
                            <input type="text" class="form-control" id="carga-disciplina" placeholder="Ex: 60h" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Período *</label>
                            <input type="text" class="form-control" id="periodo-disciplina" placeholder="Ex: 1º" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ementa *</label>
                            <textarea class="form-control" id="ementa-disciplina" rows="2" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold">
                            <i class="bi bi-floppy-fill me-2"></i>Cadastrar Disciplina
                        </button>
                    </form>
                </section>

                <section class="tabela-custom p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h5 class="fw-bold m-0" style="color: var(--cor-primaria);">
                            <i class="bi bi-journal-bookmark-fill me-2"></i>Disciplinas Ofertadas
                        </h5>
                        <div class="d-flex gap-2 align-items-center">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="pesquisa-disciplinas" placeholder="Pesquisar disciplina..." onkeyup="pesquisarTabela('pesquisa-disciplinas', 'tabela-disciplinas')">
                            </div>
                            <button class="btn btn-sm btn-success text-nowrap shadow-sm" onclick="exportarCSV(STORAGE_KEYS.DISCIPLINAS, 'relatorio_disciplinas')">
                                <i class="bi bi-file-earmark-excel me-1"></i>Exportar CSV
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead><tr><th>Código</th><th>Nome</th><th>Carga Horária</th><th>Período</th><th>Ementa</th><th>Ações</th></tr></thead>
                            <tbody id="tabela-disciplinas">
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>

            <footer class="rodape">&copy; 2026 SGA - Todos os direitos reservados.</footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
