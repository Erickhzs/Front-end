<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Turmas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-hamburguer">
        <span class="icon-open"><i class="bi bi-list"></i></span>
        <span class="icon-close"><i class="bi bi-x-lg"></i></span>
    </label>
    <label for="menu-toggle" class="overlay-sidebar"></label>

    <div class="layout-principal">
        <nav class="sidebar">
            <a href="dashboard.html" class="logo-sidebar"><i class="bi bi-mortarboard-fill"></i><span>SGA</span></a>
            <ul class="menu-navegacao">
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
                <li><a href="alunos.html"><i class="bi bi-people-fill"></i><span>Alunos</span></a></li>
                <li><a href="professores.html"><i class="bi bi-person-workspace"></i><span>Professores</span></a></li>
                <li><a href="disciplinas.html"><i class="bi bi-book-fill"></i><span>Disciplinas</span></a></li>
                <li><a href="turmas.html" class="ativo"><i class="bi bi-diagram-3-fill"></i><span>Turmas</span></a></li>
                <li><a href="notas.html"><i class="bi bi-clipboard-check-fill"></i><span>Notas</span></a></li>
            </ul>
            <div class="rodape-sidebar">SGA v1.0</div>
        </nav>

        <div class="conteudo-principal">
            <header class="topo-header">
                <div class="breadcrumb-custom"><strong>Turmas</strong> / Listagem</div>
                <div class="info-usuario">
                    <span>Bem-vindo(a), <strong>Administrador</strong></span>
                    <div class="avatar">A</div>
                    <a href="#" onclick="fazerLogout(event)" class="btn-sair"><i class="bi bi-box-arrow-right"></i> Sair</a>
                </div>
            </header>

            <main class="main-content">
                <section class="form-container mb-5">
                    <h2 class="titulo-form"><i class="bi bi-diagram-3-plus me-2"></i>Cadastrar Turma</h2>

                    <form onsubmit="return cadastrarTurma()" id="form-turma">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Código da Turma *</label>
                                <input type="text" class="form-control" id="codigo-turma" placeholder="Ex: T01" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Disciplina *</label>
                                <select class="form-select" id="disciplina-turma" required>
                                    <option value="">Carregando...</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Professor *</label>
                                <select class="form-select" id="professor-turma" required>
                                    <option value="">Carregando...</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Sala *</label>
                                <input type="text" class="form-control" id="sala-turma" placeholder="Ex: Lab 3" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Turno *</label>
                                <select class="form-select" id="turno-turma" required>
                                    <option value="">Selecione...</option>
                                    <option value="Matutino">Matutino</option>
                                    <option value="Vespertino">Vespertino</option>
                                    <option value="Noturno">Noturno</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Vagas *</label>
                                <input type="number" class="form-control" id="vagas-turma" min="1" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold mt-2">
                            <i class="bi bi-floppy-fill me-2"></i>Cadastrar Turma
                        </button>
                    </form>
                </section>

                <section class="tabela-custom p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h5 class="fw-bold m-0" style="color: var(--cor-primaria);">
                            <i class="bi bi-diagram-3-fill me-2"></i>Turmas Ativas
                        </h5>
                        <div class="d-flex gap-2 align-items-center">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="pesquisa-turmas" placeholder="Pesquisar turma..." onkeyup="pesquisarTabela('pesquisa-turmas', 'tabela-turmas')">
                            </div>
                            <button class="btn btn-sm btn-success text-nowrap shadow-sm" onclick="exportarCSV(STORAGE_KEYS.TURMAS, 'relatorio_turmas')">
                                <i class="bi bi-file-earmark-excel me-1"></i>Exportar CSV
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead><tr><th>Código</th><th>Disciplina</th><th>Professor</th><th>Sala</th><th>Turno</th><th>Vagas</th><th>Ações</th></tr></thead>
                            <tbody id="tabela-turmas">
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>

            <footer class="rodape">&copy; 2026 SGA - Todos os direitos reservados.</footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
