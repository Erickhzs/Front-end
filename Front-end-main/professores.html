<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGA - Professores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-hamburguer">
        <span class="icon-open"><i class="bi bi-list"></i></span>
        <span class="icon-close"><i class="bi bi-x-lg"></i></span>
    </label>
    <label for="menu-toggle" class="overlay-sidebar"></label>

    <div class="layout-principal">
        <nav class="sidebar">
            <a href="dashboard.html" class="logo-sidebar"><i class="bi bi-mortarboard-fill"></i><span>SGA</span></a>
            <ul class="menu-navegacao">
                <li><a href="dashboard.html"><i class="bi bi-speedometer2"></i><span>Dashboard</span></a></li>
                <li><a href="alunos.html"><i class="bi bi-people-fill"></i><span>Alunos</span></a></li>
                <li><a href="professores.html" class="ativo"><i class="bi bi-person-workspace"></i><span>Professores</span></a></li>
                <li><a href="disciplinas.html"><i class="bi bi-book-fill"></i><span>Disciplinas</span></a></li>
                <li><a href="turmas.html"><i class="bi bi-diagram-3-fill"></i><span>Turmas</span></a></li>
                <li><a href="notas.html"><i class="bi bi-clipboard-check-fill"></i><span>Notas</span></a></li>
            </ul>
            <div class="rodape-sidebar">SGA v1.0</div>
        </nav>

        <div class="conteudo-principal">
            <header class="topo-header">
                <div class="breadcrumb-custom"><strong>Professores</strong> / Cadastro</div>
                <div class="info-usuario">
                    <span>Bem-vindo(a), <strong>Administrador</strong></span>
                    <div class="avatar">A</div>
                    <a href="#" onclick="fazerLogout(event)" class="btn-sair"><i class="bi bi-box-arrow-right"></i> Sair</a>
                </div>
            </header>

            <main class="main-content">

                <section class="form-container mb-5">
                    <h2 class="titulo-form"><i class="bi bi-person-plus-fill me-2"></i>Cadastrar Professor</h2>

                    <form onsubmit="return cadastrarProfessor()" id="form-professor">
                        <div class="mb-3">
                            <label class="form-label">Nome *</label>
                            <input type="text" class="form-control" id="nome-professor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Registro *</label>
                            <input type="text" class="form-control" id="registro-professor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">E-mail *</label>
                            <input type="email" class="form-control" id="email-professor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Especialidade *</label>
                            <input type="text" class="form-control" id="especialidade-professor" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Titulação *</label>
                            <select class="form-select" id="titulacao-professor" required>
                                <option value="">Selecione...</option>
                                <option value="Graduado">Graduado</option>
                                <option value="Mestre">Mestre</option>
                                <option value="Doutor">Doutor</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary px-4 py-2 fw-bold">
                            <i class="bi bi-floppy-fill me-2"></i>Cadastrar Professor
                        </button>
                    </form>
                </section>

                <section class="tabela-custom p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                        <h5 class="fw-bold m-0" style="color: var(--cor-primaria);">
                            <i class="bi bi-person-lines-fill me-2"></i>Corpo Docente
                        </h5>
                        <div class="d-flex gap-2 align-items-center">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" class="form-control" id="pesquisa-professores" placeholder="Pesquisar professor..." onkeyup="pesquisarTabela('pesquisa-professores', 'tabela-professores')">
                            </div>
                            <button class="btn btn-sm btn-success text-nowrap shadow-sm" onclick="exportarCSV(STORAGE_KEYS.PROFESSORES, 'relatorio_professores')">
                                <i class="bi bi-file-earmark-excel me-1"></i>Exportar CSV
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr><th>Registro</th><th>Nome</th><th>Email</th><th>Especialidade</th><th>Titulação</th><th>Ações</th></tr>
                            </thead>
                            <tbody id="tabela-professores"></tbody>
                        </table>
                    </div>
                </section>

            </main>

            <footer class="rodape">&copy; 2026 SGA</footer>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
